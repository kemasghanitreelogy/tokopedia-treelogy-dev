# The safety net under the webhooks.
#
# Webhooks are fast but never guaranteed: a deploy mid-push, a cold start that ran long, a
# minute of platform trouble, and the push is gone. This sweep asks the platforms directly
# for the last three days of orders and posts whatever the ledger says is missing. It is
# idempotent end to end - the ledger and Jurnal's custom_id both refuse a duplicate - so
# running it when nothing was missed costs a few reads and writes nothing.
#
# GitHub Actions is the scheduler because the Vercel project is on the Hobby plan, whose
# crons run once a day at best. Actions schedules can drift by ten minutes or so under
# load; that is fine for a net whose job is minutes-to-hours, not seconds.
name: Mekari Jurnal sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: mekari-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sapu pesanan yang terlewat ke Jurnal
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://tokopedia-treelogy-dev.vercel.app
        run: |
          set -euo pipefail
          # Several short calls rather than one long one: Vercel kills a function at 120
          # seconds with no response and no log line, so each call takes a small batch and
          # says how many are left; the loop stops when nothing is, or after four rounds.
          # dry=0 asks for a live run; the endpoint still refuses unless MEKARI_SYNC_LIVE=1
          # is set on the deployment, so this flag alone can never write.
          total_failed=0
          for round in 1 2 3 4 5 6; do
            body=$(curl -sS --fail-with-body --max-time 110 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE_URL}/api/mekari-sync?dry=0&days=7&limit=15")
            echo "--- ronde ${round}"
            echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ("ok","live","orders_seen","considered","posted","remaining","created","exists","failed","deferred","mismatch","voided","needs_review","ranOutOfTime","skipped","channel_errors","timings","took_ms")}, ensure_ascii=False))'
            ok=$(echo "$body" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin).get("ok") else "no")')
            test "$ok" = "yes"
            failed=$(echo "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("failed",0))')
            total_failed=$((total_failed + failed))
            # Deferred orders (429, 5xx, deadline) are not failures: they are simply not
            # done yet, and another round is the right response.
            more=$(echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if (d.get("remaining") or 0) > 0 or d.get("ranOutOfTime") or (d.get("deferred") or 0) > 0 else "no")')
            test "$more" = "yes" || break
            # Jurnal's quota is ~40 requests a minute; a round uses most of it. Wait for
            # the window to roll over rather than spend the next round discovering that.
            sleep 60
          done
          # A failed order is reported, not swallowed: the job goes red so somebody looks.
          test "$total_failed" = "0"

      - name: Lapor ke Telegram kalau sapuan gagal
        if: failure()
        env:
          TELEGRAM_BOT: ${{ secrets.TELEGRAM_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The endpoint cannot report a run the platform killed; this is the one alarm
          # that fires anyway.
          test -n "$TELEGRAM_BOT" && test -n "$TELEGRAM_CHAT_ID" || exit 0
          curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=<b>🛑 Sapuan Jurnal (GitHub) gagal</b>%0AEndpoint tidak menjawab 2xx atau ada faktur yang gagal.%0A<a href=\"${RUN_URL}\">Lihat log run</a>" >/dev/null || true
