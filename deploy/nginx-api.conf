# /etc/nginx/sites-available/api.treelogy-services.my.id
#
# Menghentikan TLS dan meneruskan semuanya ke proses Node di 127.0.0.1:3000.
#
# Sengaja berdiri sendiri: tidak meng-`include` berkas bawaan certbot
# (options-ssl-nginx.conf, ssl-dhparams.pem). Certbot di server ini berhasil menerbitkan
# sertifikat tapi gagal memasangnya ke nginx, jadi berkas-berkas itu belum tentu ada -
# dan config yang meng-include berkas yang tidak ada membuat `nginx -t` gagal, yang
# artinya mengganti config yang sudah jalan dengan yang rusak.
server {
    listen 80;
    listen [::]:80;
    server_name api.treelogy-services.my.id;

    # Biarkan certbot memperbarui sertifikat lewat HTTP-01 tanpa terkena redirect.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.treelogy-services.my.id;

    ssl_certificate     /etc/letsencrypt/live/api.treelogy-services.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.treelogy-services.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cetak label mengembalikan PDF gabungan dan bisa memakan waktu; unggahan tetap kecil.
    client_max_body_size 10m;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
