<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Treelogy">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#6E8663"/>
      <stop offset="1" stop-color="#3C4C36"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
