<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treelogy TikTok Shop</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#14171a; --muted:#5b6470; --line:rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#1a1d23; --fg:#e8eaed; --muted:#98a2b3; --line:#2a2f38; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { max-width:30rem; padding:2.5rem; border-radius:16px; background:var(--card); border:1px solid var(--line); }
  h1 { font-size:1.15rem; margin:0 0 .5rem; }
  p { color:var(--muted); font-size:.925rem; margin:.35rem 0; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85rem;
         background:rgba(127,127,127,.15); padding:.15rem .4rem; border-radius:5px; }
</style>
<div class="card">
  <h1>Treelogy &middot; TikTok Shop integration</h1>
  <p>This deployment only hosts the OAuth callback for the seller app.</p>
  <p>Callback endpoint: <code>/api/callback</code></p>
  <p>Health: <code>/api/status</code></p>
</div>
