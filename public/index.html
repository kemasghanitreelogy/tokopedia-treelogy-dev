<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treelogy Omnichannel</title>
<style>
  /* Treelogy palette, the same sage and deep forest the dashboard uses, so arriving here
     and arriving there feel like one place. */
  :root {
    color-scheme: light dark;
    --bg:#F4F5F1; --card:#fff; --fg:#14171a; --muted:#5b6470; --line:rgba(0,0,0,.08);
    --brand:#526547; --brand-ink:#F1F3EE;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141A17; --card:#1B2320; --fg:#F1F3EE; --muted:#A7B3A6; --line:#2E3A34; --brand:#8FA97F; --brand-ink:#141A17; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { max-width:26rem; width:100%; padding:2.5rem; border-radius:16px; background:var(--card); border:1px solid var(--line);
          box-shadow:0 1px 2px rgba(0,0,0,.06), 0 12px 32px -20px rgba(0,0,0,.4); }
  h1 { font-size:1.2rem; margin:0 0 .35rem; letter-spacing:-.01em; }
  p { color:var(--muted); font-size:.9rem; margin:.35rem 0 0; }
  .go { display:flex; align-items:center; justify-content:center; gap:.5rem; margin-top:1.75rem;
        padding:.85rem 1.25rem; min-height:48px; border-radius:11px; text-decoration:none;
        background:var(--brand); color:var(--brand-ink); font-weight:600; font-size:.95rem;
        transition:filter 160ms cubic-bezier(.25,1,.5,1); }
  .go:hover { filter:brightness(1.12); }
  .go:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
  .go svg { width:1.05rem; height:1.05rem; flex:none; }
  .links { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1.25rem; font-size:.8rem }
  .links a { color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line) }
  .links a:hover { color:var(--fg) }
</style>
<div class="card">
  <h1>Treelogy Omnichannel</h1>
  <p>Pesanan, stok, label, dan pembukuan dari Shopee, Tokopedia, TikTok Shop, dan Shopify.</p>

  <a class="go" href="/api/dashboard">
    Buka Dashboard
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M13.5 4.5 21 12l-7.5 7.5M21 12H3"/>
    </svg>
  </a>

  <div class="links">
    <a href="/api/dashboard?view=forecast">Prakiraan stok</a>
    <a href="/api/dashboard?view=labels">Cetak label</a>
    <a href="/api/status">Status sistem</a>
  </div>
</div>
